          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest tests/unit/test_system_optimization_models.py
          tests/unit/test_system_optimization_engine.py
          tests/unit/test_system_optimization_confirmation.py
          tests/unit/test_system_optimization_tools.py
