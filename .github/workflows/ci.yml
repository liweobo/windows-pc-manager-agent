          --cov-config=tests/office-coverage.ini
          --cov=pc_manager_agent.safety.office --cov=pc_manager_agent.confirmation.office_documents
          --cov=pc_manager_agent.authorization.office_documents --cov=pc_manager_agent.backup.office_documents
          --cov=pc_manager_agent.office.commit --cov=pc_manager_agent.persistence.office_documents
          --cov=pc_manager_agent.domain.office_documents --cov=pc_manager_agent.domain.office_plans
          --cov=pc_manager_agent.tools.office_tools --cov=pc_manager_agent.office.resolution
          --cov=pc_manager_agent.platform_support.windows.office_files
          --cov-report=term-missing --cov-fail-under=95 -q
      - name: Stage 4E1 read-only optimization boundary
        if: matrix.python-version == '3.13'
