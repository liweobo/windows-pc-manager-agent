name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests and core coverage
        run: uv run pytest -m "not performance" --cov=pc_manager_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Security boundary coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/security tests/unit/test_confirmation.py
          tests/unit/test_system_diagnostic_confirmation.py
          tests/unit/test_rollback.py tests/unit/test_authorized_paths.py
          tests/unit/test_registry.py tests/unit/test_file_operation_models.py
          tests/unit/test_file_operation_tools.py
          tests/unit/test_file_operation_planner.py
          tests/unit/test_trash_models.py
          tests/unit/test_trash_confirmation.py
          tests/unit/test_process_action_models.py
          tests/unit/test_process_confirmation.py
          tests/unit/test_process_resolution.py
          tests/unit/test_process_tools.py
          tests/unit/test_service_action_models.py
          tests/unit/test_service_startup_actions.py
          tests/unit/test_startup_actions.py
          tests/unit/test_startup_resolver.py
          tests/unit/test_recycle_bin_platform.py
          tests/unit/test_software_boundary_branches.py
          tests/unit/test_software_confirmation.py
          tests/unit/test_software_policy_and_impact.py
          tests/unit/test_msi_uninstall_safety_branches.py
          tests/unit/test_vendor_uninstall_metadata_and_policy.py
          tests/unit/test_vendor_uninstall_safety_gates.py
          tests/unit/test_vendor_uninstall_confirmation.py
          tests/integration/test_file_operations_flow.py
          tests/integration/test_operation_transactions.py
          tests/integration/test_trash_flow.py
          tests/integration/test_trash_recovery.py
          tests/integration/test_process_action_flow.py
          tests/integration/test_service_action_flow.py
          tests/integration/test_service_startup_workflow.py
          tests/integration/test_software_uninstall_analysis_flow.py
          tests/integration/test_startup_action_workflow.py
          tests/security/test_service_startup_safety.py
          tests/security/test_startup_safety.py
          --cov=pc_manager_agent.safety
          --cov=pc_manager_agent.confirmation --cov=pc_manager_agent.rollback
          --cov=pc_manager_agent.recovery
          --cov=pc_manager_agent.authorization.service
          --cov=pc_manager_agent.orchestration.file_analysis_planner
          --cov=pc_manager_agent.tools.registry --cov-report=term-missing
          --cov-fail-under=95
      - name: No permanent-delete production paths
        run: uv run pytest tests/security/test_trash_safety.py -q
      - name: Stage 4D1 uninstall-analysis zero-execution boundary
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/unit/test_software_models.py
          tests/unit/test_software_inventory_and_resolution.py
          tests/unit/test_uninstall_metadata_and_capability.py
          tests/unit/test_software_tools.py
          tests/unit/test_software_boundary_branches.py
          tests/security/test_software_policy.py
          tests/security/test_software_uninstall_zero_execution.py
          --cov-config=.coveragerc-stage4d1
          --cov=pc_manager_agent.domain.software_uninstall_analysis
          --cov=pc_manager_agent.orchestration.software_inventory
          --cov=pc_manager_agent.orchestration.software_target_resolver
          --cov=pc_manager_agent.orchestration.software_capability
          --cov=pc_manager_agent.platform_support.windows.uninstall_metadata
          --cov=pc_manager_agent.safety.software_uninstall_policy
          --cov=pc_manager_agent.safety.software_uninstall_validator
          --cov=pc_manager_agent.safety.software_zero_execution
          --cov=pc_manager_agent.tools.system_tools.software_analysis
          --cov-report=term-missing --cov-fail-under=95 -q
      - name: Stage 4D2A synthetic MSI uninstall boundary
        if: matrix.python-version == '3.13'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest tests/unit/test_msi_uninstall_validation.py
          tests/unit/test_msi_uninstall_adapter.py
          tests/unit/test_msi_uninstall_safety_branches.py
          tests/integration/test_msi_uninstall_workflow.py
          tests/security/test_msi_uninstall_execution_security.py
          tests/gui/test_software_uninstall_dialog.py
          --cov=pc_manager_agent.domain.software_uninstall_execution
          --cov=pc_manager_agent.orchestration.software_msi_validation
          --cov=pc_manager_agent.safety.software_uninstall_execution_policy
          --cov=pc_manager_agent.orchestration.software_execution_preflight
          --cov=pc_manager_agent.confirmation.software_uninstall_execution
          --cov=pc_manager_agent.platform_support.windows.msi_uninstall
          --cov=pc_manager_agent.orchestration.software_uninstall_verifier
          --cov-report=term-missing --cov-fail-under=85 -q
      - name: Stage 4D2B synthetic Vendor uninstall boundary
        if: matrix.python-version == '3.13'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest tests/unit/test_vendor_uninstall_metadata_and_policy.py
          tests/unit/test_vendor_uninstall_safety_gates.py
          tests/unit/test_vendor_uninstall_confirmation.py
          tests/unit/test_vendor_uninstall_adapter.py
          tests/unit/test_vendor_uninstall_verifier.py
          tests/unit/test_software_uninstall_router.py
          tests/integration/test_vendor_uninstall_workflow.py
          tests/security/test_vendor_uninstall_security.py
          tests/gui/test_vendor_uninstall_dialog.py
          --cov=pc_manager_agent.domain.vendor_uninstall
          --cov=pc_manager_agent.orchestration.vendor_uninstall_metadata
          --cov=pc_manager_agent.safety.vendor_argument_policy
          --cov=pc_manager_agent.safety.vendor_executable_trust
          --cov=pc_manager_agent.safety.vendor_uninstall_policy
          --cov=pc_manager_agent.safety.vendor_uninstall_preview
          --cov=pc_manager_agent.safety.vendor_uninstall_validator
          --cov=pc_manager_agent.confirmation.vendor_uninstall
          --cov=pc_manager_agent.persistence.vendor_uninstall
          --cov=pc_manager_agent.platform_support.windows.vendor_uninstall
          --cov=pc_manager_agent.orchestration.vendor_uninstall_execution
          --cov=pc_manager_agent.orchestration.vendor_uninstall_verifier
          --cov-report=term-missing --cov-fail-under=85 -q
      - name: Real Windows Recycle Bin disposable probe
        if: matrix.python-version == '3.13'
        env:
          PC_MANAGER_RUN_REAL_RECYCLE_TEST: "1"
        run: uv run pytest tests/integration/test_windows_recycle_bin_real.py -q
      - name: Real Windows process adapter disposable probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_process_management_real.py -q
      - name: Real Windows startup read-only adapter probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_startup_readonly.py -q
      - name: Real Windows service read-only adapter probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_service_control_readonly.py -q
      - name: Real Windows service startup-type read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_service_startup_readonly.py -q
      - name: Real Windows installed-software read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_software_inventory_readonly.py -q
      - name: Real Windows Installer registration read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_msi_inventory_readonly.py -q
      - name: 10,000-file streaming benchmark
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_large_scan.py -q -s
      - name: 10,000-record software inventory benchmark
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_software_inventory_performance.py -q -s
      - name: Python security scan
        run: uv run bandit -q -r src
      - name: Dependency vulnerability scan
        run: uv run pip-audit
      - name: Build wheel and source archive
        run: uv build
      - name: Offscreen startup check
        run: uv run python -m pc_manager_agent --smoke-test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
