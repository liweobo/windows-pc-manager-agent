name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Install managed Chromium for Stage 5C contract tests
        if: matrix.python-version == '3.13'
        run: uv run playwright install chromium
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests and core coverage
        run: uv run pytest -m "not performance and not playwright" --cov=pc_manager_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Security boundary coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/security tests/unit/test_confirmation.py
          --ignore=tests/security/test_browser_boundaries.py
          tests/unit/voice
          tests/unit/office tests/integration/office
          tests/unit/test_system_optimization_confirmation.py
          tests/unit/test_system_diagnostic_confirmation.py
          tests/unit/test_rollback.py tests/unit/test_authorized_paths.py
          tests/unit/test_registry.py tests/unit/test_file_operation_models.py
          tests/unit/test_file_operation_tools.py
          tests/unit/test_file_operation_planner.py
          tests/unit/test_trash_models.py
          tests/unit/test_trash_confirmation.py
          tests/unit/test_process_action_models.py
          tests/unit/test_process_confirmation.py
          tests/unit/test_process_resolution.py
          tests/unit/test_process_tools.py
          tests/unit/test_service_action_models.py
          tests/unit/test_service_startup_actions.py
          tests/unit/test_privileged_confirmation_branches.py
          tests/unit/test_privileged_model_boundaries.py
          tests/unit/test_stage4x3_handlers.py
          tests/unit/test_stage4x3_policies.py
          tests/unit/test_startup_actions.py
          tests/unit/test_startup_resolver.py
          tests/unit/test_recycle_bin_platform.py
          tests/unit/test_software_boundary_branches.py
          tests/unit/test_software_confirmation.py
          tests/unit/test_software_policy_and_impact.py
          tests/unit/test_msi_uninstall_safety_branches.py
          tests/unit/test_vendor_uninstall_metadata_and_policy.py
          tests/unit/test_vendor_uninstall_safety_gates.py
          tests/unit/test_vendor_uninstall_confirmation.py
          tests/unit/test_winget_identity_inventory_and_mapping.py
          tests/unit/test_winget_uninstall_confirmation.py
          tests/unit/test_winget_uninstall_safety_gates.py
          tests/unit/test_msix_uninstall.py
          tests/unit/test_msix_preflight.py
          tests/unit/test_software_residual_policies.py
          tests/unit/test_residual_cleanup_policy_branches.py
          tests/unit/test_residual_cleanup_safety_branches.py
          tests/unit/test_residual_cleanup_confirmation.py
          tests/unit/test_residual_cleanup_revalidation_branches.py
          tests/integration/test_file_operations_flow.py
          tests/integration/test_operation_transactions.py
          tests/integration/test_trash_flow.py
          tests/integration/test_trash_recovery.py
          tests/integration/test_process_action_flow.py
          tests/integration/test_service_action_flow.py
          tests/integration/test_service_startup_workflow.py
          tests/integration/test_software_uninstall_analysis_flow.py
          tests/integration/test_msix_uninstall_workflow.py
          tests/integration/test_startup_action_workflow.py
          tests/security/test_service_startup_safety.py
          tests/security/test_startup_safety.py
          --cov-config=.coveragerc-cross-stage-security
          --cov=pc_manager_agent.safety
          --cov=pc_manager_agent.confirmation --cov=pc_manager_agent.rollback
          --cov=pc_manager_agent.recovery
          --cov=pc_manager_agent.authorization.service
          --cov=pc_manager_agent.orchestration.file_analysis_planner
          --cov=pc_manager_agent.tools.registry --cov-report=term-missing
          --cov-fail-under=95
      - name: No permanent-delete production paths
        run: uv run pytest tests/security/test_trash_safety.py -q
      - name: Stage 5A synthetic Office and native file safety
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/unit/office tests/integration/office
          tests/security/test_office_boundaries.py tests/security/test_office_failure_paths.py
