          tests/gui/test_software_uninstall_dialog.py -q
      - name: Build isolated Stage 4X2 Broker without real UAC
        if: matrix.python-version == '3.13'
        shell: pwsh
        run: |
          ./scripts/build-privileged-broker.ps1
          $broker = Resolve-Path 'dist/pc-manager-privileged-broker/pc-manager-privileged-broker.exe'
          $manifest = "$broker.manifest"
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'Adjacent asInvoker manifest missing' }
          $forbidden = Select-String -Path 'build/pc-manager-privileged-broker/xref-pc-manager-privileged-broker.html' -Pattern 'PySide6|openai|pc_manager_agent.providers|pc_manager_agent.ui|pc_manager_agent.voice|speech_to_text|text_to_speech'
          if ($forbidden) { throw 'Broker package contains a forbidden GUI/model/provider module' }
          $process = Start-Process -FilePath $broker -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 20) { throw "Broker no-argument guard returned $($process.ExitCode)" }
      - name: Real Windows MSIX inventory read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_msix_windows_inventory.py -q
      - name: Real Windows Recycle Bin disposable probe
        if: matrix.python-version == '3.13'
        env:
          PC_MANAGER_RUN_REAL_RECYCLE_TEST: "1"
        run: uv run pytest tests/integration/test_windows_recycle_bin_real.py -q
      - name: Real Windows process adapter disposable probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_process_management_real.py -q
      - name: Real Windows startup read-only adapter probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_startup_readonly.py -q
      - name: Real Windows service read-only adapter probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_service_control_readonly.py -q
      - name: Real Windows service startup-type read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_service_startup_readonly.py -q
      - name: Real Windows installed-software read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_software_inventory_readonly.py -q
      - name: Real Windows Installer registration read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_msi_inventory_readonly.py -q
      - name: Real Windows winget inventory read-only probe
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/integration/test_windows_winget_inventory_readonly.py -q
      - name: 10,000-file streaming benchmark
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_large_scan.py -q -s
      - name: 10,000-record software inventory benchmark
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_software_inventory_performance.py -q -s
      - name: 10,001-object residual metadata benchmark
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_software_residual_performance.py -q -s
      - name: 5,001-object selected-only Fresh residual benchmark
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_residual_cleanup_performance.py -q -s
      - name: Stage 4E2 Fresh-discovery hard-limit benchmark
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_system_cleanup_limits.py -q -s
      - name: Stage 5A synthetic document budgets
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/performance/test_office_document_budget.py -q -s
      - name: Stage 5B synthetic voice and native audio critical boundary
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/unit/voice tests/gui/test_voice_audio.py
          tests/gui/test_voice_interaction.py tests/integration/test_voice_request_flow.py
          tests/security/test_voice_boundaries.py
          --cov-config=.coveragerc-stage5b
          --cov=pc_manager_agent.voice
          --cov=pc_manager_agent.domain.voice
          --cov=pc_manager_agent.domain.user_requests
          --cov=pc_manager_agent.safety.voice
          --cov=pc_manager_agent.confirmation.voice_disclosure
          --cov=pc_manager_agent.persistence.voice
          --cov=pc_manager_agent.audit.voice
          --cov=pc_manager_agent.orchestration.user_requests
          --cov=pc_manager_agent.ui.voice_audio
          --cov=pc_manager_agent.providers.speech_logging
          --cov-report=term-missing --cov-fail-under=95 -q
      - name: Stage 5C isolated browser and web safety boundary
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/unit/browser tests/integration/browser
          tests/security/test_browser_boundaries.py tests/gui/test_browser_tab.py
          --cov=pc_manager_agent.domain.browser
          --cov=pc_manager_agent.domain.browser_downloads
          --cov=pc_manager_agent.domain.browser_plans
          --cov=pc_manager_agent.safety.browser
          --cov=pc_manager_agent.confirmation.browser
          --cov=pc_manager_agent.persistence.browser
          --cov=pc_manager_agent.orchestration.browser
          --cov=pc_manager_agent.browser.client
          --cov=pc_manager_agent.browser.protocol
          --cov=pc_manager_agent.browser.worker
          --cov=pc_manager_agent.tools.browser_tools
          --cov=pc_manager_agent.audit.browser
          --cov-report=term-missing --cov-fail-under=85 -q
      - name: Stage 5C browser safety and confirmation coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/unit/browser tests/integration/browser/test_browser_workflow.py
          tests/security/test_browser_boundaries.py
          --cov=pc_manager_agent.safety.browser
          --cov=pc_manager_agent.confirmation.browser
          --cov=pc_manager_agent.persistence.browser
          --cov-report=term-missing --cov-fail-under=95 -q
      - name: Stage 5D bounded Agent and Memory integration
        if: matrix.python-version == '3.13'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uv run pytest tests/unit/agents tests/unit/context tests/unit/memory
          tests/integration/test_stage5d_multi_agent_flow.py
          tests/security/test_stage5d_boundaries.py
          tests/gui/test_task_center.py tests/gui/test_memory_tab.py tests/gui/test_main_window.py
          --cov-config=.coveragerc-stage5d
          --cov=pc_manager_agent.agents
          --cov=pc_manager_agent.app.agents
          --cov=pc_manager_agent.audit.memory
          --cov=pc_manager_agent.audit.multi_agent
          --cov=pc_manager_agent.config.agents
          --cov=pc_manager_agent.context
          --cov=pc_manager_agent.domain.agents
          --cov=pc_manager_agent.domain.context
          --cov=pc_manager_agent.domain.memory
          --cov=pc_manager_agent.domain.task_graph
          --cov=pc_manager_agent.domain.task_outcomes
          --cov=pc_manager_agent.memory
          --cov=pc_manager_agent.orchestration.agent_runtime
          --cov=pc_manager_agent.orchestration.agent_selection
          --cov=pc_manager_agent.orchestration.delegation
          --cov=pc_manager_agent.orchestration.resource_locks
          --cov=pc_manager_agent.orchestration.task_graph
          --cov=pc_manager_agent.persistence.memory
          --cov=pc_manager_agent.persistence.task_runtime
          --cov=pc_manager_agent.providers.llm.agent_base
          --cov=pc_manager_agent.providers.llm.openai_agents
          --cov=pc_manager_agent.safety.agent_capabilities
          --cov=pc_manager_agent.safety.context
          --cov=pc_manager_agent.safety.cross_domain
          --cov=pc_manager_agent.safety.memory
          --cov=pc_manager_agent.safety.task_goal
          --cov=pc_manager_agent.safety.task_graph
          --cov=pc_manager_agent.ui.memory_tab
          --cov=pc_manager_agent.ui.task_center_tab
          --cov-report=term-missing --cov-fail-under=85 -q
      - name: Stage 5D Agent security and Context coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run pytest tests/unit/agents tests/unit/context tests/unit/memory
          tests/integration/test_stage5d_multi_agent_flow.py
          tests/security/test_stage5d_boundaries.py
          --cov-config=.coveragerc-stage5d
          --cov=pc_manager_agent.safety.agent_capabilities
          --cov=pc_manager_agent.safety.task_graph
          --cov=pc_manager_agent.safety.task_goal
          --cov=pc_manager_agent.safety.context
          --cov=pc_manager_agent.safety.cross_domain
          --cov=pc_manager_agent.safety.memory
          --cov=pc_manager_agent.context.governance
          --cov-report=term-missing --cov-fail-under=95 -q
      - name: Python security scan
        run: uv run bandit -q -r src
      - name: Dependency vulnerability scan
        run: uv run pip-audit
      - name: Build wheel and source archive
        run: uv build
      - name: Offscreen startup check
        run: uv run python -m pc_manager_agent --smoke-test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
