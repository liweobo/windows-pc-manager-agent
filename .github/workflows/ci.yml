name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests and core coverage
        run: uv run pytest --cov=pc_manager_agent --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Security boundary coverage
        if: matrix.python-version == '3.13'
        run: uv run pytest tests/security tests/unit/test_confirmation.py tests/unit/test_rollback.py --cov=pc_manager_agent.safety --cov=pc_manager_agent.confirmation --cov=pc_manager_agent.rollback --cov-report=term-missing --cov-fail-under=95
      - name: Python security scan
        run: uv run bandit -q -r src
      - name: Dependency vulnerability scan
        run: uv run pip-audit
      - name: Build wheel and source archive
        run: uv build
      - name: Offscreen startup check
        run: uv run python -m pc_manager_agent --smoke-test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
